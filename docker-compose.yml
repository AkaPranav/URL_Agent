version: '3.8'

services:
  ui:
    build: .
    container_name: url-agent-ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    command: streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0

  api:
    build: .
    container_name: url-agent-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn app:app --host 0.0.0.0 --port 8000
